openapi: 3.0.4
info:
  title: Brise LAN API
  version: 3.0.0
  contact:
    name: AGST
    email: ped@agst.com.br
    url: https://www.agst.com.br
  description: |
    A **Brise LAN API** é a interface para comunicação direta com dispositivos Brise dentro de uma mesma rede local, sem necessidade de conexão com a internet.  
    Projetada para ambientes onde a latência, confiabilidade ou segurança são críticas, ela permite o controle e monitoramento local de dispositivos Brise por meio de chamadas HTTP/HTTPS diretamente ao dispositivo na mesma rede.

    Todos os dados são trocados no formato **JSON**, seguindo padrões RESTful, facilitando a integração com sistemas de automação residencial, industrial e predial que operam offline ou exigem resposta em tempo real.

    ### Funcionalidades Principais

    - **Comunicação direta com dispositivos Brise** na rede local  
    - **Controle imediato** de operações  
    - **Leitura de status e métricas em tempo real** sem intermediários  
    - **Operação independente do serviço** — ideal para ambientes isolados ou restritos  

    A API utiliza autenticação simples e não depende de serviços externos, garantindo disponibilidade contínua mesmo sem acesso à internet.

    ### Quando usar a Brise LAN API?

    Esta API é recomendada nos seguintes cenários:
    - Falhas frequentes ou ausência de conectividade com a internet.
    - Necessidade de baixa latência no controle (ex: automação crítica).
    - Políticas de segurança que proíbem ou restringem tráfego via internet.

    > ⚠️ **Importante**: A Brise Local API opera apenas dentro da rede local. O endereço IP do dispositivo ou gateway Brise deve ser conhecido e acessível pela aplicação cliente.

    Para integrações híbridas, combine esta API com a **Brise Cloud API** e mantenha o controle local com supervisão remota.

    # 🔐 Autenticação

    Este tópico descreve os métodos de autenticação disponíveis e como utilizá-los.  

    <!-- ReDoc-Inject: <security-definitions> -->

servers:
  - url: "http://{device-ip}/api/v3"
    description: Dispositivo Brise na rede local (substitua {device-ip})

tags:
  - name: Rede
    description: Operações relacionadas à configuração e status da rede do dispositivo Brise.
  - name: Sistema
    description: |
      Operações de manutenção e controle do sistema do dispositivo Brise.

      > ⚠️ **Aviso**: Alguns endpoints desta categoria são de uso interno e não devem ser expostos publicamente.

paths:
  /network/status:
    get:
      tags:
        - Rede
      summary: Status de rede
      description: |
        Retorna as informações completas de rede do dispositivo Brise, abrangendo as interfaces:
        - **Station (STA)** — conexão Wi-Fi cliente.
        - **Access Point (AP)** — rede Wi-Fi criada pelo dispositivo.
        - **Ethernet (ETH)** — conexão com fio, se disponível.

        > Interfaces não presentes no dispositivo ou desativadas **não serão incluídas** na resposta.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status completo de todas as interfaces de rede
          content:
            application/json:
              schema:
                type: object
                properties:
                  station:
                    type: object
                    description: Informações da interface Wi-Fi no modo estação (cliente).
                    properties:
                      ssid_station:
                        type: string
                        description: Nome da rede Wi-Fi à qual o dispositivo está conectado.
                        example: "RedeBrise"
                      channel_station:
                        type: integer
                        description: Canal de operação da rede Wi-Fi.
                        example: 6
                      signal_station:
                        type: integer
                        description: Intensidade do sinal da rede Wi-Fi em dBm (valores negativos, quanto mais próximo de zero, melhor).
                        example: -62
                      dhcp:
                        type: boolean
                        description: Indica se o endereço IP foi obtido automaticamente via DHCP.
                        example: true
                      ip_station:
                        type: string
                        description: Endereço IP atual da interface Wi-Fi (modo estação).
                        example: "192.168.0.105"
                      netmask_station:
                        type: string
                        description: Máscara de rede configurada para a interface Wi-Fi.
                        example: "255.255.255.0"
                      gateway_station:
                        type: string
                        description: Endereço IP do gateway configurado.
                        example: "192.168.0.1"
                      mac_station:
                        type: string
                        description: Endereço MAC físico da interface Wi-Fi (modo estação).
                        example: "84:CC:A8:42:1F:7B"
                      dns_station:
                        type: array
                        description: Lista de servidores DNS configurados.
                        items:
                          type: string
                        example: "8.8.8.8"
                      sntp_station:
                        type: string
                        nullable: true
                        description: Endereço do servidor SNTP utilizado para sincronização de horário.
                        example: "pool.ntp.org"

                  ap:
                    type: object
                    description: Informações da interface Wi-Fi no modo ponto de acesso (AP).
                    properties:
                      ssid_ap:
                        type: string
                        description: Nome da rede Wi-Fi criada pelo dispositivo.
                        example: "Brise-Setup"
                      channel_ap:
                        type: integer
                        description: Canal de operação da rede Wi-Fi em modo AP.
                        example: 11
                      ip_ap:
                        type: string
                        description: Endereço IP do ponto de acesso.
                        example: "192.168.4.1"
                      netmask_ap:
                        type: string
                        description: Máscara de rede configurada para o ponto de acesso.
                        example: "255.255.255.0"
                      gateway_ap:
                        type: string
                        description: Endereço IP do gateway do ponto de acesso (normalmente o próprio dispositivo).
                        example: "192.168.4.1"
                      mac_ap:
                        type: string
                        description: Endereço MAC físico da interface Wi-Fi em modo AP.
                        example: "84:CC:A8:42:1F:7C"
                      dns_ap:
                        type: array
                        description: Lista de servidores DNS configurados para o ponto de acesso.
                        items:
                          type: string
                        example: "192.168.4.1"

                  eth:
                    type: object
                    description: Informações da interface Ethernet, se disponível.
                    properties:
                      dhcp:
                        type: boolean
                        description: Indica se o endereço IP foi obtido automaticamente via DHCP.
                        example: false
                      ip_eth:
                        type: string
                        description: Endereço IP da interface Ethernet.
                        example: "192.168.0.106"
                      netmask_eth:
                        type: string
                        description: Máscara de rede configurada para a interface Ethernet.
                        example: "255.255.255.0"
                      gateway_eth:
                        type: string
                        description: Endereço IP do gateway configurado para a interface Ethernet.
                        example: "192.168.0.1"
                      mac_eth:
                        type: string
                        description: Endereço MAC físico da interface Ethernet.
                        example: "84:CC:A8:42:1F:7D"
                      dns_eth:
                        type: array
                        description: Lista de servidores DNS configurados para a interface Ethernet.
                        items:
                          type: string
                        example: "8.8.8.8"
                      sntp_eth:
                        type: string
                        nullable: true
                        description: Endereço do servidor SNTP utilizado para sincronização de horário via Ethernet.
                        example: "pool.ntp.org"

              examples:
                exemplo_completo:
                  summary: Exemplo com todas as interfaces ativas
                  value:
                    station:
                      ssid_station: "RedeBrise"
                      channel_station: 6
                      signal_station: -62
                      dhcp: true
                      ip_station: "192.168.0.105"
                      netmask_station: "255.255.255.0"
                      gateway_station: "192.168.0.1"
                      mac_station: "84:CC:A8:42:1F:7B"
                      dns_station: "8.8.8.8"
                      sntp_station: "pool.ntp.org"
                    ap:
                      ssid_ap: "Brise-Setup"
                      channel_ap: 11
                      ip_ap: "192.168.4.1"
                      netmask_ap: "255.255.255.0"
                      gateway_ap: "192.168.4.1"
                      mac_ap: "84:CC:A8:42:1F:7C"
                      dns_ap: "192.168.4.1"
                    eth:
                      dhcp: false
                      ip_eth: "192.168.0.106"
                      netmask_eth: "255.255.255.0"
                      gateway_eth: "192.168.0.1"
                      mac_eth: "84:CC:A8:42:1F:7D"
                      dns_eth: "8.8.8.8"
                      sntp_eth: "pool.ntp.org"
        "500":
          description: Erro interno ao obter informações de rede
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /network/wifi:
    put:
      tags:
        - Rede
      summary: Configura Wi-Fi
      description: |
        Define o SSID e a senha da rede Wi-Fi à qual o dispositivo Brise deve se conectar.  
        Após a atualização, o dispositivo tentará conectar automaticamente à nova rede.

        > ⚠️ Durante o processo de troca de rede, a conexão atual será interrompida.  
        > O dispositivo aplicará as novas credenciais e reiniciará o módulo de rede.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ssid
                - password
              properties:
                ssid:
                  type: string
                  description: Nome da rede Wi-Fi (SSID) à qual o dispositivo deve se conectar.
                  example: "RedeBrise"
                password:
                  type: string
                  description: Senha da rede Wi-Fi. Deve conter entre 8 e 63 caracteres para redes WPA/WPA2/WPA3.
                  example: "12345678"
      responses:
        "200":
          description: Configuração aplicada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica se a configuração foi aplicada corretamente.
                    example: true
              examples:
                sucesso:
                  summary: Exemplo de sucesso
                  value:
                    success: true
        "400":
          description: Requisição inválida. Verifique os dados enviados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Rede
      summary: Lista redes Wi-Fi
      description: |
        Retorna a lista mais recente de redes Wi-Fi detectadas pelo dispositivo.  
        O dispositivo executa varreduras automáticas periodicamente (a cada 30 segundos), mantendo a lista atualizada em cache.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de redes encontradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_scan:
                    type: string
                    format: date-time
                    description: Data e hora da última varredura concluída com sucesso (UTC).
                    example: "2025-10-31T10:22:15Z"
                  networks:
                    type: array
                    description: Lista de redes Wi-Fi detectadas durante a última varredura.
                    items:
                      type: object
                      properties:
                        ssid:
                          type: string
                          description: Nome (SSID) da rede detectada.
                          example: "RedeBrise"
                        rssi:
                          type: integer
                          description: Intensidade do sinal em dBm. Valores mais negativos indicam sinal mais fraco.
                          example: -62
                        security:
                          type: string
                          description: "Tipo de segurança da rede (ex: `WPA2`, `WPA3`, `Open`)."
                          example: "WPA2"
                        channel:
                          type: integer
                          description: Canal Wi-Fi no qual a rede foi detectada.
                          example: 6
              examples:
                exemplo:
                  summary: Exemplo de resposta
                  value:
                    last_scan: "2025-10-31T10:22:15Z"
                    networks:
                      - ssid: "RedeBrise"
                        rssi: -62
                        security: "WPA2"
                        channel: 6
                      - ssid: "RedeAGST"
                        rssi: -78
                        security: "WPA3"
                        channel: 11

  /network/wifi/scan:
    post:
      tags:
        - Rede
      summary: Scan Wi-Fi
      description: |
        Solicita ao dispositivo que execute imediatamente uma nova varredura Wi-Fi, atualizando o cache de redes observadas.  

        > 🕒 A operação é assíncrona: a lista pode levar alguns segundos para refletir as novas redes detectadas.  
        > Use `GET /network/wifi` para verificar quando o cache for atualizado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Varredura iniciada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica se a solicitação foi aceita.
                    example: true
                  started_at:
                    type: string
                    format: date-time
                    description: Data e hora de início da varredura (UTC).
                    example: "2025-10-31T10:21:00Z"
              examples:
                sucesso:
                  summary: Exemplo de sucesso
                  value:
                    success: true
                    started_at: "2025-10-31T10:21:00Z"
        "409":
          description: Já existe uma varredura em andamento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Código do erro indicando que uma operação de varredura já está em execução.
                    example: ALREADY_IN_PROGRESS

  /system/update:
    post:
      tags:
        - Sistema
      summary: Atualização Upload 🔑
      description: |
        Recebe um arquivo binário contendo o firmware a ser instalado no dispositivo.
        Após o recebimento bem-sucedido, o arquivo será verificado, implementado e o dispositivo será reiniciado automaticamente.

        > ⚠️ **Privado**: Este endpoint é de uso interno e não deve ser divulgado na documentação pública.
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        description: Arquivo binário de firmware (.bin)
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Upload concluído. O dispositivo iniciará a atualização e reiniciará em breve.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Firmware recebido. Reiniciando para atualização..."
        "400":
          description: Arquivo inválido ou corrompido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno durante o processo de atualização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/update_url:
    post:
      tags:
        - Sistema
      summary: Atualização Download 🔑
      description: |
        Recebe a URL de um servidor remoto que contém o arquivo binário de firmware. 
        O dispositivo fará o download do arquivo, verificará sua integridade, aplicará a atualização e reiniciará automaticamente.

        > ⚠️ **Privado**: Este endpoint é de uso interno e não deve ser divulgado na documentação pública.
      x-internal: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: URL direta para download do arquivo binário (.bin)
                  example: "https://brise.com.br/fw/v1.0.1_firmware.bin"
      responses:
        "200":
          description: Solicitação de download aceita. O dispositivo iniciará o download e a atualização em breve.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Download iniciado. O dispositivo reiniciará após a conclusão."
        "400":
          description: URL inválida ou inacessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro ao baixar ou processar a atualização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      title: Bearer Authentication
      type: http
      scheme: bearer
      description: |
        O token de acesso deve ser enviado no cabeçalho `Authorization` da sua requisição autenticada.

        ```
        Authorization: Bearer <seu-token>
        ```
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Código de erro representando o tipo de falha da requisição.
          example: INVALID_REQUEST
